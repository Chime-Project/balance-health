<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Balance Health — Page Index</title>
  <link rel="icon" href="favicon.svg?v=1000" type="image/svg+xml">
  <link rel="stylesheet" href="tokens/colors.css?v=1000">
  <link rel="stylesheet" href="tokens/type.css?v=1000">
  <link rel="stylesheet" href="css/fonts.css?v=1000">
  <style>
    body { margin: 0; font-family: var(--font-body); color: var(--color-text); background: var(--color-bg-soft); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 48px var(--gutter) 64px; }
    .logo { width: 150px; height: auto; display: block; }
    h1 { margin: 32px 0 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-h1); line-height: var(--leading-h1); }
    .updated { margin: 8px 0 0; color: var(--color-text-muted); font-size: 14px; }
    h2 { margin: 40px 0 12px; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; background: var(--bh-white); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--color-border); vertical-align: top; font-size: 15px; line-height: 22px; }
    th { background: var(--bh-signature-navy); color: var(--bh-white); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    code { font-size: 13px; color: var(--color-text-muted); }
    a { color: var(--color-link); font-weight: 700; }
    @media (max-width: 640px) { th:nth-child(2), td:nth-child(2) { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/brand/balance-wordmark-navy.svg?v=1000" alt="Balance Health" width="150" height="18">
    <h1>Page Index</h1>
    <p class="updated">Updated 8 October 2026</p>

    <h2>Core site</h2>
    <table>
      <thead><tr><th>Page</th><th>File</th><th>What it is</th><th>Link</th></tr></thead>
      <tbody>
        <tr>
          <td>Homepage (demo)</td>
          <td><code>index.html</code></td>
          <td>Proposal homepage in the Balance Health brand, with the approved homepage copy and an early-access sign-up form.</td>
          <td><a href="https://chime-project.github.io/balance-health/" target="_blank" rel="noopener">Open</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
